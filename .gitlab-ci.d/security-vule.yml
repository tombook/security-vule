# security-vule GitLab CI/CD template
# Save as .gitlab-ci.yml in your project root, or include via:
#   include:
#     - remote: 'https://raw.githubusercontent.com/security-vule/security-vule/main/.gitlab-ci.d/security-vule.yml'

variables:
  SV_SEVERITY_THRESHOLD: "HIGH"  # CRITICAL|HIGH|MEDIUM|LOW|NONE
  SV_SARIF_ARTIFACT: "security-vule.sarif"
  SV_BASELINE: ""  # path to baseline file, or empty to skip

stages:
  - test
  - report

security-vule:scan:
  stage: test
  image: oven/bun:1
  before_script:
    - bun --version
  script:
    - |
      SCAN_ARGS="scan . --sarif --output ${SV_SARIF_ARTIFACT}"
      if [ -n "${SV_BASELINE}" ]; then
        SCAN_ARGS="${SCAN_ARGS} --baseline ${SV_BASELINE} --diff"
      fi
      bun run src/cli.ts ${SCAN_ARGS} || SV_EXIT=$?
      SV_EXIT=${SV_EXIT:-0}
      if [ "${SV_SEVERITY_THRESHOLD}" = "CRITICAL" ] && [ $SV_EXIT -ne 0 ]; then
        echo "::error::security-vule found CRITICAL severity issues"
        exit 1
      fi
      if [ "${SV_SEVERITY_THRESHOLD}" = "HIGH" ] && [ $SV_EXIT -ne 0 ]; then
        # HIGH is the default: any non-zero exit on any high+ finding
        echo "::error::security-vule found HIGH+ severity issues"
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      sast: "${SV_SARIF_ARTIFACT}"
    paths:
      - "${SV_SARIF_ARTIFACT}"

security-vule:poc-verify:
  stage: test
  image: python:3.11-slim
  needs: ["security-vule:scan"]
  before_script:
    - pip install --quiet requests pyyaml
  script:
    - |
      nohup python3 poc-validator/mock_dvwa.py 8080 > /tmp/mock_dvwa.log 2>&1 &
      sleep 2
      bun run src/cli.ts scan . --output /tmp/sv_findings.json || true
      python3 poc-validator/verify_poc.py \
        --findings /tmp/sv_findings.json \
        --output /tmp/sv_poc_verified.json || true
      cat /tmp/sv_poc_verified.json | python3 -c "
      import json, sys
      r = json.load(sys.stdin)
      print(f'Verified: {r[\"verified\"]}/{r[\"total_findings\"]} (precision {r[\"verified\"]/(r[\"verified\"]+r[\"unverified\"] or 1)*100:.1f}%)')
      "
  artifacts:
    when: always
    paths:
      - /tmp/sv_poc_verified.json
    expire_in: 30 days
  allow_failure: true  # PoC verification is best-effort

# MR comment with summary
security-vule:comment:
  stage: report
  image: curlimages/curl:latest
  needs: ["security-vule:scan"]
  script:
    - |
      if [ -z "${CI_MERGE_REQUEST_IID}" ]; then
        echo "Not a merge request; skipping comment"
        exit 0
      fi
      SUMMARY=$(cat <<EOF
      ### security-vule scan summary
      See \`${SV_SARIF_ARTIFACT}\` artifact for full results.
      EOF
      )
      curl --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --data-urlencode "body=${SUMMARY}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
  allow_failure: true
