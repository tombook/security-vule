name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-check:
    name: License compliance check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install license-checker
        run: bun add -d license-checker

      - name: Run license check (blocks GPL/AGPL-UNKNOWN/UNKNOWN/WTFPL)
        run: bun run license:check

      - name: Generate license summary
        run: |
          mkdir -p docs/compliance
          bun run license:summary > docs/compliance/licenses.txt
          echo "📄 License distribution saved to docs/compliance/licenses.txt"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: docs/compliance/licenses.txt
          retention-days: 90

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
