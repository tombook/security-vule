name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-integration:
    name: Unit + Integration (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Start Postgres
        run: |
          docker compose -f docker-compose.yml up -d db redis
          # 等待 DB 就绪
          for i in {1..30}; do
            docker compose -f docker-compose.yml exec -T db pg_isready -U security_vule && break
            sleep 1
          done
      - name: Install deps
        run: bun install
      - name: Run migrations
        run: bun run scripts/migrate.ts
        env:
          DATABASE_URL: postgresql://security_vule:dev_password@localhost:5433/security_vule
      - name: Run RBAC + RLS + multi-tenant tests
        env:
          DATABASE_URL: postgresql://security_vule:dev_password@localhost:5433/security_vule
          TEST_DATABASE_URL: postgresql://security_vule:dev_password@localhost:5433/security_vule
          JWT_SECRET: test-jwt-secret-min-32-chars-padding-1234567
        run: |
          bun test tests/integration/multi_tenant_isolation.test.ts
          bun test tests/integration/rbac_matrix.test.ts
          bun test tests/integration/rls_coverage.test.ts
          bun test tests/integration/auth.test.ts
          bun test tests/integration/user_management.test.ts
          bun test tests/integration/cross_portal_boundary.test.ts
          bun test tests/integration/billing_isolation.test.ts
          bun test tests/integration/soft_delete_recovery.test.ts
          bun test tests/integration/api_keys_webhooks.test.ts
          bun test tests/integration/audit_chain.test.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: unit-integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Start API + DB
        run: |
          docker compose -f docker-compose.yml up -d db redis
          bun run scripts/migrate.ts
          bun run apps/api &  # 后台启动
          sleep 5
      - name: Run E2E
        env:
          DATABASE_URL: postgresql://security_vule:dev_password@localhost:5433/security_vule
          JWT_SECRET: test-jwt-secret-min-32-chars-padding-1234567
        run: bunx playwright test tests/e2e/

  perf:
    name: Performance (k6)
    runs-on: ubuntu-latest
    needs: unit-integration
    if: github.event.schedule == 'nightly'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A1DB88A40EBCC7BAB55C6A1B4
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6
      - name: Start DB + API
        run: |
          docker compose -f docker-compose.yml up -d db redis
          bun run scripts/migrate.ts
          bun run apps/api &
          sleep 5
      - name: k6 read
        env:
          BASE_URL: http://localhost:3000
          TEST_TOKEN: ${{ secrets.PERF_TEST_TOKEN }}
        run: k6 run tests/perf/api-read.js
      - name: k6 write
        env:
          BASE_URL: http://localhost:3000
          TEST_TOKEN: ${{ secrets.PERF_TEST_TOKEN }}
        run: k6 run tests/perf/api-write.js